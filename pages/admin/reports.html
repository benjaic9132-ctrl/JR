<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR - Reportes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #101315;
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1);
        }

        .sidebar-logo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar nav a {
            display: block;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .content {
            margin-left: 250px;
            padding: 30px;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            float: right;
        }

        .btn-logout:hover {
            background: #c0392b;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .chart-card h3 {
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .chart-container {
            height: 300px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 10px;
        }

        .bar {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 6px 6px 0 0;
            position: relative;
            min-height: 20px;
            transition: all 0.3s ease;
        }

        .bar:hover {
            opacity: 0.8;
        }

        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #687073;
        }

        .bar-value {
            position: absolute;
            top: -25px;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
        }

        .stats-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .stats-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .stats-table thead {
            background: #f9f9f9;
            border-bottom: 2px solid #e8e8e8;
        }

        .stats-table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #687073;
        }

        .stats-table td {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .stats-table tbody tr:hover {
            background: #f9f9f9;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e8e8e8;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #687073;
        }

        @media (max-width: 768px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .content {
                margin-left: 0;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">📊 JR Admin</div>
            <nav>
                <a href="dashboard.html">📈 Dashboard</a>
                <a href="users.html">👥 Usuarios</a>
                <a href="reports.html" class="active">📋 Reportes</a>
                <a href="#" onclick="logout()">🚪 Salir</a>
            </nav>
        </aside>

        <main class="content">
            <div class="header">
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
                <h1>📊 Reportes y Análisis</h1>
                <p style="color: #687073; font-size: 14px; margin-top: 5px;">Análisis completo del sistema</p>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h3>Distribución de Roles</h3>
                    <div class="chart-container" id="rolesChart"></div>
                </div>
                <div class="chart-card">
                    <h3>Estado de Usuarios</h3>
                    <div class="chart-container" id="statusChart"></div>
                </div>
            </div>

            <div class="stats-table">
                <table>
                    <thead>
                        <tr>
                            <th>Métrica</th>
                            <th>Valor</th>
                            <th>Porcentaje</th>
                        </tr>
                    </thead>
                    <tbody id="statsBody">
                        <tr>
                            <td colspan="3" class="empty-state">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        // Proteger página
        if (!protectPage('admin')) {
            throw new Error('Acceso denegado');
        }

        function loadReports() {
            const allUsers = auth.getAllUsers();
            
            // Calcular datos
            const admins = allUsers.filter(u => u.role === 'admin').length;
            const clients = allUsers.filter(u => u.role === 'client').length;
            const active = allUsers.filter(u => u.active).length;
            const inactive = allUsers.length - active;
            const total = allUsers.length;

            // Crear gráfico de roles
            const rolesChart = document.getElementById('rolesChart');
            rolesChart.innerHTML = '';
            
            if (total > 0) {
                const adminHeight = (admins / total) * 250;
                const clientHeight = (clients / total) * 250;
                
                rolesChart.innerHTML = `
                    <div class="bar" style="height: ${adminHeight}px; background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);">
                        <div class="bar-value">${admins}</div>
                        <div class="bar-label">Admin</div>
                    </div>
                    <div class="bar" style="height: ${clientHeight}px; background: linear-gradient(135deg, #27ae60 0%, #229954 100%);">
                        <div class="bar-value">${clients}</div>
                        <div class="bar-label">Clientes</div>
                    </div>
                `;
            }

            // Crear gráfico de estado
            const statusChart = document.getElementById('statusChart');
            statusChart.innerHTML = '';
            
            if (total > 0) {
                const activeHeight = (active / total) * 250;
                const inactiveHeight = (inactive / total) * 250;
                
                statusChart.innerHTML = `
                    <div class="bar" style="height: ${activeHeight}px; background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);">
                        <div class="bar-value">${active}</div>
                        <div class="bar-label">Activos</div>
                    </div>
                    <div class="bar" style="height: ${inactiveHeight}px; background: linear-gradient(135deg, #bdc3c7 0%, #95a5a6 100%);">
                        <div class="bar-value">${inactive}</div>
                        <div class="bar-label">Inactivos</div>
                    </div>
                `;
            }

            // Crear tabla de estadísticas
            const statsBody = document.getElementById('statsBody');
            statsBody.innerHTML = `
                <tr>
                    <td>Total de Usuarios</td>
                    <td><strong>${total}</strong></td>
                    <td><div class="progress-bar"><div class="progress-fill" style="width: 100%;"></div></div></td>
                </tr>
                <tr>
                    <td>Administradores</td>
                    <td><strong>${admins}</strong></td>
                    <td>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${total > 0 ? (admins/total)*100 : 0}%;"></div></div>
                        <small style="color: #687073;">${total > 0 ? ((admins/total)*100).toFixed(1) : 0}%</small>
                    </td>
                </tr>
                <tr>
                    <td>Clientes</td>
                    <td><strong>${clients}</strong></td>
                    <td>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${total > 0 ? (clients/total)*100 : 0}%;"></div></div>
                        <small style="color: #687073;">${total > 0 ? ((clients/total)*100).toFixed(1) : 0}%</small>
                    </td>
                </tr>
                <tr>
                    <td>Usuarios Activos</td>
                    <td><strong>${active}</strong></td>
                    <td>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${total > 0 ? (active/total)*100 : 0}%;"></div></div>
                        <small style="color: #687073;">${total > 0 ? ((active/total)*100).toFixed(1) : 0}%</small>
                    </td>
                </tr>
                <tr>
                    <td>Usuarios Inactivos</td>
                    <td><strong>${inactive}</strong></td>
                    <td>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${total > 0 ? (inactive/total)*100 : 0}%;"></div></div>
                        <small style="color: #687073;">${total > 0 ? ((inactive/total)*100).toFixed(1) : 0}%</small>
                    </td>
                </tr>
            `;
        }

        // Inicializar
        loadReports();
    </script>
</body>
</html>
