<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR - Gestión de Usuarios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #101315;
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1);
        }

        .sidebar-logo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar nav a {
            display: block;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .content {
            margin-left: 250px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #c0392b;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .toolbar h2 {
            font-size: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .users-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .users-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table thead {
            background: #f9f9f9;
            border-bottom: 2px solid #e8e8e8;
        }

        .users-table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #687073;
        }

        .users-table td {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .users-table tbody tr:hover {
            background: #f9f9f9;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-admin {
            background: #ffe5e5;
            color: #c0392b;
        }

        .badge-client {
            background: #e5f3ff;
            color: #2980b9;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .status.active {
            background: #e5f8e5;
            color: #27ae60;
        }

        .status.inactive {
            background: #f5f5f5;
            color: #687073;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 4px;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d7d7d7;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Manrope', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .btn-save {
            background: #667eea;
            color: white;
        }

        .btn-save:hover {
            background: #5568d3;
        }

        .btn-cancel {
            background: #e8e8e8;
            color: #101315;
        }

        .btn-cancel:hover {
            background: #d0d0d0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #687073;
        }

        @media (max-width: 768px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">📊 JR Admin</div>
            <nav>
                <a href="dashboard.html">📈 Dashboard</a>
                <a href="users.html" class="active">👥 Usuarios</a>
                <a href="reports.html">📋 Reportes</a>
                <a href="#" onclick="logout()">🚪 Salir</a>
            </nav>
        </aside>

        <main class="content">
            <div class="header">
                <h1>Gestión de Usuarios</h1>
                <div class="user-info">
                    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
                </div>
            </div>

            <div class="toolbar">
                <h2>Usuarios Registrados</h2>
                <button class="btn-primary" onclick="openCreateModal()">+ Nuevo Usuario</button>
            </div>

            <div class="users-table">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Registrado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="6" class="empty-state">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal para crear/editar usuario -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Crear Usuario</h2>
            <form id="userForm">
                <div class="form-group">
                    <label for="formUsername">Usuario</label>
                    <input type="text" id="formUsername" required>
                </div>
                <div class="form-group">
                    <label for="formEmail">Email</label>
                    <input type="email" id="formEmail" required>
                </div>
                <div class="form-group">
                    <label for="formPassword">Contraseña</label>
                    <input type="password" id="formPassword" required>
                </div>
                <div class="form-group">
                    <label for="formRole">Rol</label>
                    <select id="formRole">
                        <option value="client">Cliente</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Guardar</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        // Proteger página
        if (!protectPage('admin')) {
            throw new Error('Acceso denegado');
        }

        let editingUserId = null;

        function loadUsers() {
            const allUsers = auth.getAllUsers();
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (allUsers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No hay usuarios registrados</td></tr>';
                return;
            }

            allUsers.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td><span class="badge badge-${u.role}">${u.role === 'admin' ? 'Admin' : 'Cliente'}</span></td>
                    <td><span class="status ${u.active ? 'active' : 'inactive'}">${u.active ? 'Activo' : 'Inactivo'}</span></td>
                    <td>${formatDate(u.createdAt)}</td>
                    <td>
                        <button class="btn-small btn-edit" onclick="editUser(${u.id})">Editar</button>
                        <button class="btn-small btn-delete" onclick="deleteUserConfirm(${u.id})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openCreateModal() {
            editingUserId = null;
            document.getElementById('modalTitle').textContent = 'Crear Usuario';
            document.getElementById('userForm').reset();
            document.getElementById('formPassword').required = true;
            document.getElementById('userModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
            editingUserId = null;
        }

        function editUser(userId) {
            const user = auth.getUser(userId);
            if (!user) return;

            editingUserId = userId;
            document.getElementById('modalTitle').textContent = 'Editar Usuario';
            document.getElementById('formUsername').value = user.username;
            document.getElementById('formUsername').disabled = true;
            document.getElementById('formEmail').value = user.email;
            document.getElementById('formPassword').required = false;
            document.getElementById('formPassword').placeholder = 'Dejar en blanco para no cambiar';
            document.getElementById('formRole').value = user.role;
            document.getElementById('userModal').classList.add('active');
        }

        function deleteUserConfirm(userId) {
            if (confirm('¿Estás seguro de que deseas eliminar este usuario?')) {
                const result = auth.deleteUser(userId);
                if (result.success) {
                    showNotification('Usuario eliminado correctamente', 'success');
                    loadUsers();
                } else {
                    showNotification(result.error, 'error');
                }
            }
        }

        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('formUsername').value.trim();
            const email = document.getElementById('formEmail').value.trim();
            const password = document.getElementById('formPassword').value;
            const role = document.getElementById('formRole').value;

            if (editingUserId === null) {
                // Crear nuevo
                const result = auth.createUser(username, email, password, role);
                if (result.success) {
                    showNotification('Usuario creado correctamente', 'success');
                    closeModal();
                    loadUsers();
                } else {
                    showNotification(result.error, 'error');
                }
            } else {
                // Editar existente
                const updates = {
                    email,
                    role
                };
                if (password) {
                    updates.password = password;
                }
                const result = auth.updateUser(editingUserId, updates);
                if (result.success) {
                    showNotification('Usuario actualizado correctamente', 'success');
                    closeModal();
                    loadUsers();
                } else {
                    showNotification(result.error, 'error');
                }
            }
        });

        // Cerrar modal al hacer clic fuera
        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Inicializar
        loadUsers();
    </script>
</body>
</html>
