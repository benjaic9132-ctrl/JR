<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR - Dashboard Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #101315;
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1);
        }

        .sidebar-logo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar nav a {
            display: block;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .content {
            margin-left: 250px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #667eea;
        }

        .stat-card h3 {
            color: #687073;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #101315;
        }

        .stat-card.clients { border-left-color: #27ae60; }
        .stat-card.admins { border-left-color: #e74c3c; }
        .stat-card.active { border-left-color: #3498db; }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            margin-top: 30px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .users-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .users-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table thead {
            background: #f9f9f9;
            border-bottom: 2px solid #e8e8e8;
        }

        .users-table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #687073;
        }

        .users-table td {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .users-table tbody tr:hover {
            background: #f9f9f9;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-admin {
            background: #ffe5e5;
            color: #c0392b;
        }

        .badge-client {
            background: #e5f3ff;
            color: #2980b9;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .status.active {
            background: #e5f8e5;
            color: #27ae60;
        }

        .status.inactive {
            background: #f5f5f5;
            color: #687073;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 4px;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #687073;
        }

        .empty-state p {
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .content {
                margin-left: 0;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .users-table {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">📊 JR Admin</div>
            <nav>
                <a href="dashboard.html" class="active">📈 Dashboard</a>
                <a href="users.html">👥 Usuarios</a>
                <a href="reports.html">📋 Reportes</a>
                <a href="#" onclick="logout()">🚪 Salir</a>
            </nav>
        </aside>

        <main class="content">
            <div class="header">
                <div>
                    <h1>Dashboard</h1>
                    <p style="color: #687073; font-size: 14px; margin-top: 5px;">Bienvenido al panel administrativo</p>
                </div>
                <div class="user-info">
                    <span id="userDisplay" style="color: #101315;"></span>
                    <span class="user-badge" id="roleDisplay"></span>
                    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card clients">
                    <h3>Total Clientes</h3>
                    <div class="value" id="totalClients">0</div>
                </div>
                <div class="stat-card admins">
                    <h3>Administradores</h3>
                    <div class="value" id="totalAdmins">0</div>
                </div>
                <div class="stat-card active">
                    <h3>Usuarios Activos</h3>
                    <div class="value" id="totalActive">0</div>
                </div>
            </div>

            <h2 class="section-title">Últimos Usuarios Registrados</h2>
            <div class="users-table">
                <table id="recentUsersTable">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Registrado</th>
                        </tr>
                    </thead>
                    <tbody id="recentUsersBody">
                        <tr>
                            <td colspan="5" class="empty-state">
                                <p>Cargando usuarios...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
        // Proteger página
        if (!protectPage('admin')) {
            throw new Error('Acceso denegado');
        }

        const user = getCurrentUser();

        // Mostrar información del usuario
        document.getElementById('userDisplay').textContent = `👤 ${user.name}`;
        document.getElementById('roleDisplay').textContent = user.role === 'admin' ? 'Administrador' : 'Cliente';

        // Cargar estadísticas
        function loadStats() {
            const allUsers = auth.getAllUsers();
            const clients = allUsers.filter(u => u.role === 'client').length;
            const admins = allUsers.filter(u => u.role === 'admin').length;
            const active = allUsers.filter(u => u.active).length;

            document.getElementById('totalClients').textContent = clients;
            document.getElementById('totalAdmins').textContent = admins;
            document.getElementById('totalActive').textContent = active;
        }

        // Cargar usuarios recientes
        function loadRecentUsers() {
            const allUsers = auth.getAllUsers();
            const recent = allUsers.slice(-5).reverse();
            const tbody = document.getElementById('recentUsersBody');
            tbody.innerHTML = '';

            if (recent.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><p>No hay usuarios registrados</p></td></tr>';
                return;
            }

            recent.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td><span class="badge badge-${u.role}">${u.role === 'admin' ? 'Admin' : 'Cliente'}</span></td>
                    <td><span class="status ${u.active ? 'active' : 'inactive'}">${u.active ? 'Activo' : 'Inactivo'}</span></td>
                    <td>${formatDate(u.createdAt)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Inicializar
        loadStats();
        loadRecentUsers();
    </script>
</body>
</html>
